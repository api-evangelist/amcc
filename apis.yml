name: AMCC
description: >-
  AMCC (Applied Micro Circuits Corporation, also known as AppliedMicro or APM) was a fabless
  semiconductor company founded in 1979 and headquartered in Santa Clara, California. It designed
  network and embedded Power ISA processors, ARMv8-A server processors (the X-Gene line), and
  optical transport, connectivity, and storage silicon for telecommunications, data center, and
  industrial markets. Backed by Matrix Partners, U.S. Venture Partners, and other venture investors,
  AMCC traded on NASDAQ under the ticker AMCC. It was acquired by MACOM Technology Solutions
  (NASDAQ: MTSI) in January 2017 and no longer operates as an independent company. As a fabless chip
  designer with no public developer platform, AMCC exposes no APIs, SDKs, or developer documentation;
  this profile is retained as a historical company record and Matrix Partners portfolio lead.
